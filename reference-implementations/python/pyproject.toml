[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alx-protocol"
dynamic = ["version"]
description = "ALX Protocol — Python implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ALX Protocol contributors" }]
dependencies = [
    "eth-hash[pycryptodome]>=0.5.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://alxprotocol.com"
Documentation = "https://alxprotocol.com/documentation/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.17.6",
]

[tool.setuptools.dynamic]
version = { attr = "alx_protocol._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"conformance_adapter.py" = ["E402"]
