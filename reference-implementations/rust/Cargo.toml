[package]
name = "alx-protocol"
version = "1.0.0"
edition = "2021"
description = "ALX Protocol — deterministic infrastructure for verifiable content, interoperable context, and traceable attribution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xandrlabs/alx-protocol"
homepage = "https://github.com/xandrlabs/alx-protocol"

[[bin]]
name = "alx"
path = "src/bin/alx.rs"

[[bin]]
name = "conformance_adapter"
path = "src/bin/conformance_adapter.rs"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
sha3 = "0.10"
hex = "0.4"
regex = "1"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.6"
