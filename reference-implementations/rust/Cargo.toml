[package]
name = "alx-protocol"
version = "1.0.1"
edition = "2021"
description = "ALX Protocol — deterministic infrastructure for verifiable content, interoperable context, and traceable attribution"
license = "MIT"
readme = "README.md"
homepage = "https://alxprotocol.com"
documentation = "https://alxprotocol.com/documentation/"
# The tests read ../../test-vectors, which is not part of the crate.
exclude = ["tests/", "AGENTS.md"]

[[bin]]
name = "alx"
path = "src/bin/alx.rs"

[[bin]]
name = "conformance_adapter"
path = "src/bin/conformance_adapter.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
sha3 = "0.10"
hex = "0.4"
regex = "1"
num-bigint = "0.4"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.6"
