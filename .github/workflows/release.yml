name: Validate tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same pinned toolchain as the sdk-typescript job in ci.yml: `pnpm run ci` runs `cargo fmt --check` and
      # clippy with -D warnings.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      # Before `pnpm run ci`, which lints the Python implementation and runs its conformance adapter.
      - working-directory: reference-implementations/python
        run: pip install -e ".[dev]"
      - run: pnpm run ci
      - run: pnpm run test:contracts
      - working-directory: reference-implementations/python
        run: pytest tests/
      - working-directory: reference-implementations/rust
        run: cargo test --all-targets

  publish-release-record:
    name: Publish GitHub release record
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
