name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-schemas:
    name: Protocol schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:fixtures

  sdk-typescript:
    name: TypeScript reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  python:
    name: Python reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: reference-implementations/python
        run: |
          pip install -e ".[dev]"
          pytest tests/

  rust:
    name: Rust reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use an explicit stable toolchain version to avoid resolution/parsing flakes.
      # Replace '1.72.0' with your desired pinned toolchain if needed.
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "1.72.0"
          override: true
          components: rustfmt, clippy

      - name: Run Rust tests (with retries)
        working-directory: reference-implementations/rust
        run: |
          set -euo pipefail
          attempts=0
          until [ $attempts -ge 3 ]
          do
            if cargo test --all-targets; then
              break
            fi
            attempts=$((attempts+1))
            echo "cargo test failed; attempt $attempts/3 — retrying in 5s..."
            sleep 5
          done
          if [ $attempts -ge 3 ]; then
            echo "cargo test failed after 3 attempts"
            exit 1
          fi

  link-check:
    name: Documentation link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx markdown-link-check --config .markdown-link-check.json $(find docs/ -name '*.md') README.md CONTRIBUTING.md SECURITY.md MAINTAINERS.md

  cross-impl-conformance:
    name: Cross-implementation conformance
    runs-on: ubuntu-latest
    needs: [sdk-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "1.72.0"
          override: true
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - working-directory: reference-implementations/python
        run: pip install -e ".[dev]"

      - working-directory: reference-implementations/rust
        run: cargo build --bin conformance_adapter --release

      - name: "Conformance: TypeScript (self-test)"
        run: node conformance/bin/run.js --self-test

      - name: "Conformance: TypeScript (--impl)"
        run: node conformance/bin/run.js --impl "node sdk/conformance-adapter.js"

      - name: "Conformance: Python (--impl)"
        run: node conformance/bin/run.js --impl "python reference-implementations/python/conformance_adapter.py"

      - name: "Conformance: Rust (--impl)"
        run: node conformance/bin/run.js --impl "./reference-implementations/rust/target/release/conformance_adapter"

      - name: "Differential core check"
        run: node conformance/bin/differential-core-check.js
