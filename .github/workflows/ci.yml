name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-schemas:
    name: Protocol schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:fixtures

  sdk-typescript:
    name: TypeScript reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  python:
    name: Python reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: reference-implementations/python
        run: |
          pip install -e ".[dev]"
          pytest tests/

  rust:
    name: Rust reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: reference-implementations/rust
        run: cargo test --all-targets

  # Documentation link checker — validates all internal markdown links
  link-check:
    name: Documentation link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npx markdown-link-check --config .markdown-link-check.json $(find docs/ -name '*.md') README.md CONTRIBUTING.md SECURITY.md MAINTAINERS.md

  # Cross-implementation conformance — proves all 3 languages produce identical outputs
  cross-impl-conformance:
    name: Cross-implementation conformance
    runs-on: ubuntu-latest
    needs: [sdk-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4

      # Setup all three runtimes
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # Build TypeScript (needed by conformance runner)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Install Python implementation
      - working-directory: reference-implementations/python
        run: pip install -e ".[dev]"

      # Build Rust conformance adapter
      - working-directory: reference-implementations/rust
        run: cargo build --bin conformance_adapter --release

      # Run conformance: TypeScript (self-test)
      - name: "Conformance: TypeScript (self-test)"
        run: node conformance/bin/run.js --self-test

      # Run conformance: TypeScript (external adapter)
      - name: "Conformance: TypeScript (--impl)"
        run: node conformance/bin/run.js --impl "node sdk/conformance-adapter.js"

      # Run conformance: Python (external adapter)
      - name: "Conformance: Python (--impl)"
        run: node conformance/bin/run.js --impl "python reference-implementations/python/conformance_adapter.py"

      # Run conformance: Rust (external adapter)
      - name: "Conformance: Rust (--impl)"
        run: node conformance/bin/run.js --impl "./reference-implementations/rust/target/release/conformance_adapter"

      - name: "Differential core check"
        run: node conformance/bin/differential-core-check.js
