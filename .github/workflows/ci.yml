name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-schemas:
    name: Protocol schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:fixtures

  # `pnpm run ci` is the full repository gate (scripts/verify-repository.mjs). Besides the TypeScript work it lints the
  # Python and Rust reference implementations and runs their conformance adapters, so this job needs all three toolchains.
  sdk-typescript:
    name: TypeScript reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to Rust 1.96.0, the toolchain the full gate was last verified with locally. `lint:rust` runs
      # `cargo fmt --check` and clippy with -D warnings, so new lints or warnings in a later stable release would fail
      # this job before any TypeScript test runs. Change it deliberately, together with the local toolchain.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      # ruff for lint:python; eth-hash, pycryptodome and cryptography for the Python conformance adapter.
      - working-directory: reference-implementations/python
        run: pip install -e ".[dev]"
      - run: pnpm run ci

  python:
    name: Python reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: reference-implementations/python
        run: |
          pip install -e ".[dev]"
          python -m ruff check .
          pytest tests/

  rust:
    name: Rust reference implementation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same pinned toolchain as the sdk-typescript job: clippy runs with -D warnings.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - working-directory: reference-implementations/rust
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  contracts:
    name: Optional contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:solidity
      - run: pnpm run test:contracts

  # Documentation link checker — validates all internal markdown links
  link-check:
    name: Documentation link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdown-link-check@3.13.7 --config .markdown-link-check.json $(find docs/ -name '*.md') README.md CONTRIBUTING.md SECURITY.md MAINTAINERS.md

  # Cross-implementation conformance — proves all 3 languages produce identical outputs
  cross-impl-conformance:
    name: Cross-implementation conformance
    runs-on: ubuntu-latest
    needs: [sdk-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4

      # Setup all three runtimes
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # Build TypeScript (needed by conformance runner)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Install Python implementation
      - working-directory: reference-implementations/python
        run: pip install -e ".[dev]"

      # Build Rust conformance adapter
      - working-directory: reference-implementations/rust
        run: cargo build --bin conformance_adapter --release

      # Run conformance: TypeScript (self-test)
      - name: "Conformance: TypeScript (self-test)"
        run: node conformance/bin/run.js --self-test

      # Run conformance: TypeScript (external adapter)
      - name: "Conformance: TypeScript (--impl)"
        run: node conformance/bin/run.js --impl "node sdk/conformance-adapter.js"

      # Run conformance: Python (external adapter)
      - name: "Conformance: Python (--impl)"
        run: node conformance/bin/run.js --impl "python reference-implementations/python/conformance_adapter.py"

      # Run conformance: Rust (external adapter)
      - name: "Conformance: Rust (--impl)"
        run: node conformance/bin/run.js --impl "./reference-implementations/rust/target/release/conformance_adapter"

      # Compare canonical outputs and deterministic Graph/Trace behavior pairwise.
      - name: "Differential verification: TypeScript, Python, Rust"
        run: pnpm run test:conformance:differential

      - name: Upload differential verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-differential-report
          path: artifacts/cross-language/differential-report.json
          if-no-files-found: error
